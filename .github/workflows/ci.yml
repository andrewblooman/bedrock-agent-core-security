name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: validate
        working-directory: terraform/envs/dev
        run: |
          # agent.zip is a build artifact; validate only needs the path to exist.
          mkdir -p ../../../build && touch ../../../build/agent.zip
          terraform init -backend=false -input=false
          terraform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.5
      - run: ruff check agent tools_lambda tests
      - run: ruff format --check agent tools_lambda tests

